[workspace]
resolver = "2"
members = [
    "crates/lekhni-base",
    "crates/lekhni-text",
    "crates/lekhni-md",
    "crates/lekhni-raster",
    "crates/lekhni-shell",
    "crates/lekhni-shell-desktop",
    "crates/lekhni-ui",
    "crates/lekhni-store",
    "crates/lekhni-layout",
    "crates/lekhni-index",
    "crates/lekhni-shell-web",
    "crates/lekhni-shell-android",
    "crates/lekhni-shell-ios",
    "bench/lekhni-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Lekhni Contributors"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
